<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce PWA</title>

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#0d6efd">

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        .container {
            display: flex;
            gap: 30px;
        }

        .cart-section {
            width: 30%;
            border: 1px solid gray;
            padding: 15px;
            min-height: 300px;
        }

        .product-section {
            width: 70%;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .product {
            border: 1px solid gray;
            padding: 10px;
            width: 200px;
        }

        button {
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>E-Commerce PWA</h1>

    <div class="container">

        <!-- Cart Section -->
        <div class="cart-section">

            <h2>Cart Items</h2>

            <ul id="cartList"></ul>

        </div>

        <!-- Product Section -->
        <div class="product-section">

            <h2>Products</h2>

            <div class="products">

                <div class="product">

                    <h3>Laptop</h3>

                    <p>Price: ₹50000</p>

                    <button onclick="addToCart('Laptop')">
                        Add to Cart
                    </button>

                </div>


                <div class="product">

                    <h3>Mobile</h3>

                    <p>Price: ₹20000</p>

                    <button onclick="addToCart('Mobile')">
                        Add to Cart
                    </button>

                </div>


                <div class="product">

                    <h3>Headphones</h3>

                    <p>Price: ₹3000</p>

                    <button onclick="addToCart('Headphones')">
                        Add to Cart
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
